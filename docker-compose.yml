# 로컬

services:
  app:
    image: segment-metric-service
    container_name: segment-metric-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      USER_DB_NAME: ${USER_DB_NAME}
      USER_DB_MASTER_HOST: ${USER_DB_MASTER_HOST}
      USER_DB_SLAVE_HOST: ${USER_DB_SLAVE_HOST}
      USER_DB_USERNAME: ${USER_DB_USERNAME}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}

      SEGMENT_DB_NAME: ${SEGMENT_DB_NAME}
      SEGMENT_DB_MASTER_HOST: ${SEGMENT_DB_MASTER_HOST}
      SEGMENT_DB_SLAVE_HOST: ${SEGMENT_DB_SLAVE_HOST}
      SEGMENT_DB_USERNAME: ${SEGMENT_DB_USERNAME}
      SEGMENT_DB_PASSWORD: ${SEGMENT_DB_PASSWORD}

      APP_ASYNC_SEGMENT_COUNT_CORE_SIZE: ${SEGMENT_COUNT_CORE_SIZE}
      APP_ASYNC_SEGMENT_COUNT_MAX_SIZE: ${SEGMENT_COUNT_MAX_SIZE}
      APP_ASYNC_SEGMENT_COUNT_QUEUE_CAPACITY: ${SEGMENT_COUNT_QUEUE_CAPACITY}

      APP_ASYNC_CUBE_PERSIST_CORE_SIZE: ${CUBE_PERSIST_CORE_SIZE}
      APP_ASYNC_CUBE_PERSIST_MAX_SIZE: ${CUBE_PERSIST_MAX_SIZE}
      APP_ASYNC_CUBE_PERSIST_QUEUE_CAPACITY: ${CUBE_PERSIST_QUEUE_CAPACITY}

      ENV: local
      TZ: Asia/Seoul
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -Duser.timezone=Asia/Seoul"
    depends_on:
      user-db-slave:
        condition: service_healthy
      user-db-master:
        condition: service_healthy
      segment-db-master:
        condition: service_healthy
      segment-db-slave:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s
    networks: [app-network]

  user-db-master:
    image: mysql:8.0
    container_name: user-db-master
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${USER_DB_NAME}
      MYSQL_USER: ${USER_DB_USERNAME}
      MYSQL_PASSWORD: ${USER_DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - user-master-data:/var/lib/mysql
      - ./db/user-init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./db/seed-load.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - ./db/user-master-repl-init.sql:/docker-entrypoint-initdb.d/03-repl.sql
      - ./db/accounts.csv:/var/lib/mysql-files/accounts.csv
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [app-network]
    command: >
      --innodb-buffer-pool-size=2G
      --max-connections=300
      --secure-file-priv=/var/lib/mysql-files
      --server-id=1
      --log-bin=mysql-bin
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
    deploy:
      resources:
        limits:
          memory: 3G

  user-db-slave:
    image: mysql:8.0
    container_name: user-db-slave
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${USER_DB_NAME}
      MYSQL_USER: ${USER_DB_USERNAME}
      MYSQL_PASSWORD: ${USER_DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - user-slave-data:/var/lib/mysql
      - ./db/user-slave-repl-init.sql:/docker-entrypoint-initdb.d/01-repl.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [app-network]
    command: >
      --innodb-buffer-pool-size=2G
      --max-connections=300
      --secure-file-priv=/var/lib/mysql-files
      --innodb-adaptive-hash-index=OFF
      --server-id=2
      --read-only=1
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --relay-log=mysql-relay-bin         
      --relay-log-recovery=ON
    deploy:
      resources:
        limits:
          memory: 3G

  segment-db-master:
    image: mysql:8.0
    container_name: segment-db-master
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${SEGMENT_DB_NAME}
      MYSQL_USER: ${SEGMENT_DB_USERNAME}
      MYSQL_PASSWORD: ${SEGMENT_DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - segment-master-data:/var/lib/mysql
      - ./db/segment-init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./db/segment-master-repl-init.sql:/docker-entrypoint-initdb.d/02-repl.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [app-network]
    command: >
      --innodb-buffer-pool-size=2G
      --max-connections=300
      --server-id=3
      --log-bin=mysql-bin
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
    deploy:
      resources:
        limits:
          memory: 3G

  segment-db-slave:
    image: mysql:8.0
    container_name: segment-db-slave
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${SEGMENT_DB_NAME}
      MYSQL_USER: ${SEGMENT_DB_USERNAME}
      MYSQL_PASSWORD: ${SEGMENT_DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - segment-slave-data:/var/lib/mysql
      - ./db/segment-slave-repl-init.sql:/docker-entrypoint-initdb.d/01-repl.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [ app-network ]
    command: >
      --innodb-buffer-pool-size=2G
      --max-connections=300
      --server-id=4
      --read-only=1
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --relay-log=mysql-relay-bin      
      --relay-log-recovery=ON
    deploy:
      resources:
        limits:
          memory: 3G


  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks: [app-network]
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks: [app-network]

volumes:
  user-master-data:
  user-slave-data:
  segment-master-data:
  segment-slave-data:
  prometheus-data:
  grafana-data:

networks:
  app-network:
    driver: bridge