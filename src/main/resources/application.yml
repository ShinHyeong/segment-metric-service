spring:
  application:
    name: segment-metric-service

  datasource:
    user-master:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://${USER_DB_MASTER_HOST}:3306/${USER_DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&rewriteBatchedStatements=true
      username: ${USER_DB_USERNAME}
      password: ${USER_DB_PASSWORD}
      hikari:
        maximum-pool-size: 30
        minimum-idle: 10
        connection-timeout: 30000
        max-lifetime: 1800000
        leak-detection-threshold: 60000
        read-only: false
        pool-name: UserMaster-HikariCP
        initialization-fail-timeout: -1
    user-slave:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://${USER_DB_SLAVE_HOST}:3306/${USER_DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&rewriteBatchedStatements=true
      username: ${USER_DB_USERNAME}
      password: ${USER_DB_PASSWORD}
      hikari:
        maximum-pool-size: 30
        minimum-idle: 10
        connection-timeout: 30000
        max-lifetime: 1800000
        leak-detection-threshold: 60000
        read-only: true
        pool-name: UserSlave-HikariCP
        initialization-fail-timeout: -1

    segment-master:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://${SEGMENT_DB_MASTER_HOST}:3306/${SEGMENT_DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&rewriteBatchedStatements=true
      username: ${SEGMENT_DB_USERNAME}
      password: ${SEGMENT_DB_PASSWORD}
      hikari:
        maximum-pool-size: 30
        minimum-idle: 10
        connection-timeout: 30000
        max-lifetime: 1800000
        leak-detection-threshold: 60000
        read-only: false
        pool-name: SegmentMaster-HikariCP
        initialization-fail-timeout: -1
    segment-slave:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://${SEGMENT_DB_SLAVE_HOST}:3306/${SEGMENT_DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&rewriteBatchedStatements=true
      username: ${SEGMENT_DB_USERNAME}
      password: ${SEGMENT_DB_PASSWORD}
      hikari:
        maximum-pool-size: 30
        minimum-idle: 10
        connection-timeout: 30000
        max-lifetime: 1800000
        leak-detection-threshold: 60000
        read-only: true
        pool-name: SegmentSlave-HikariCP
        initialization-fail-timeout: -1

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        order_inserts: true
        order_updates: true
        jdbc:
          batch_size: 100
          batch_versioned_data: true

  jackson:
    time-zone: Asia/Seoul

batch:
  index:
    chunk-size: 1000
  cube:
    page-size: 1000
    chunk-size: 1000

# 비동기 작업 스레드풀 설정
app:
  async:
    segment-count:
      core-size: ${APP_ASYNC_SEGMENT_COUNT_CORE_SIZE:30}
      max-size: ${APP_ASYNC_SEGMENT_COUNT_MAX_SIZE:30}
      queue-capacity: ${APP_ASYNC_SEGMENT_COUNT_QUEUE_CAPACITY:1000}
    cube-persist:
      core-size: ${APP_ASYNC_CUBE_PERSIST_CORE_SIZE:5}
      max-size: ${APP_ASYNC_CUBE_PERSIST_MAX_SIZE:10}
      queue-capacity: ${APP_ASYNC_CUBE_PERSIST_QUEUE_CAPACITY:50}

server:
  tomcat:
    threads:
      max: 200
      min-spare: 20
    connection-timeout: 20s

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,metrics,info,threaddump
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: when-authorized
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        batch.segment.count.duration: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
        batch.segment.count.duration: 0.5,0.95,0.99
      maximum-expected-value:
        batch.segment.count.duration: 5m
      minimum-expected-value:
        batch.segment.count.duration: 1ms
    tags:
      application: segment-metric-service
      environment: ${ENV:local}

logging:
  level:
    org.hibernate.SQL: INFO
    com.zaxxer.hikari: INFO