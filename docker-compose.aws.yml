# EC2 + RDS 환경

services:
  app:
    image: ${ECR_REGISTRY}/segment-metric-service:${IMAGE_TAG:-latest}
    container_name: segment-metric-app
    ports:
      - "8080:8080"
    environment:
      USER_DB_SLAVE_HOST: ${USER_DB_SLAVE_HOST}      # RDS reader endpoint
      USER_DB_USERNAME: ${USER_DB_USERNAME}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
      SEGMENT_DB_HOST: ${SEGMENT_DB_HOST}            # RDS writer endpoint
      SEGMENT_DB_USERNAME: ${SEGMENT_DB_USERNAME}
      SEGMENT_DB_PASSWORD: ${SEGMENT_DB_PASSWORD}
      ENV: aws
      TZ: Asia/Seoul
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -Duser.timezone=Asia/Seoul"
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s
    logging:
      driver: awslogs
      options:
        awslogs-group: /ecs/segment-metric-service
        awslogs-region: ap-northeast-2
        awslogs-stream-prefix: app
        awslogs-create-group: "true"
    networks: [app-network]

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"          # k6 EC2에서 메트릭 보려면 SG로 9090 허용
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks: [app-network]
    depends_on:
      - app

volumes:
  prometheus-data:

networks:
  app-network:
    driver: bridge